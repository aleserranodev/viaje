<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Viaje">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<title>Viaje Ámsterdam, Brujas, Gante y Bruselas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2; --ink:#1F1B16; --muted:#5E554B; --line:#EADFD2; --card:#FFFFFF; --soft:#F0E8DE;
  --ams:#F26A21; --ams-soft:#FFE9D8; --ams-ink:#6B2E00;
  --bru:#2E9E5B; --bru-soft:#E3F3E9; --bru-ink:#12462A;
  --bxl:#7B4FD0; --bxl-soft:#EEE7FB; --bxl-ink:#2F1A63;
  --fly:#2F6FDE; --fly-soft:#E4EEFF; --fly-ink:#0F2B5B;
  --warn-bg:#FFF3D6; --warn-line:#F0D9A0; --warn-ink:#7A4B00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{text-decoration:none;color:inherit}
h1,h2,h3{margin:0;font-family:'Space Grotesk','Inter',sans-serif;letter-spacing:-.3px}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
#view{flex:1;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-l{display:flex;flex-direction:column;gap:24px}
.row{display:flex;align-items:center;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.card-p{padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.fph{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--soft);cursor:pointer}
.fph img{width:100%;height:100%;object-fit:cover;display:block}
.fcap{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:#3D352C;font-size:13px;line-height:18px;font-weight:500;padding:5px 10px;border-radius:14px}
.chip.price{background:var(--ams-soft);color:var(--ams-ink);font-weight:600}
.chip.walk{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font-weight:600;padding:3.5px 8.5px}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink);font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:0 16px;cursor:pointer;width:100%}
.btn.ams{background:var(--ams);color:var(--ink)}
.btn.fly{background:var(--fly);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #E3D6C6;font-weight:600}
.btn.danger{background:#fff;color:#A32020;border:1px solid #E7B9B9;font-weight:600}
.btn.sm{min-height:44px;width:auto;font-size:14px}
.btn[disabled]{opacity:.5}
.h2{font-size:20px;line-height:26px;font-weight:700}
.dot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--soft)}
.seg button{flex:1;height:44px;border:0;border-radius:12px;background:transparent;color:#3D352C;font-weight:500;font-size:15px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;height:44px;padding:0 16px;border-radius:22px;border:1px solid #E3D6C6;background:#fff;font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer}
.pill.on{background:var(--c,var(--ams));border-color:var(--c,var(--ams));font-weight:600;color:#1F1B16}
.photo{position:relative;height:190px;background:#E9DCCB}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:12px;top:12px;background:#fff;color:var(--ink);font-size:12px;line-height:16px;font-weight:600;padding:4px 10px;border-radius:12px}
.badge.hot{background:var(--ams);font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(6px + env(safe-area-inset-bottom));display:flex;max-width:520px;margin:0 auto}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;color:#3D352C;font-size:12px;line-height:16px;font-weight:500;padding:0;cursor:pointer}
.tabbar button .ic{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tabbar button.on{color:var(--ink);font-weight:700}
.tabbar button.on .ic{background:var(--ams)}
.hero{height:300px;position:relative}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(31,27,22,.15),rgba(31,27,22,0) 35%,rgba(31,27,22,.82))}
.hero .tag{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));background:var(--ams);color:var(--ink);font-size:13px;font-weight:700;padding:6px 12px;border-radius:16px}
.hero .txt{position:absolute;left:20px;right:20px;bottom:18px;color:#fff;display:flex;flex-direction:column;gap:8px}
.cityrow{display:flex;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.cityrow .im{width:104px;flex:none}
.cityrow img{width:100%;height:100%;object-fit:cover;display:block}
.tile{flex:1;border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;cursor:pointer}
.tile .o{width:40px;height:40px;border-radius:20px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}

.dstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 8px;scrollbar-width:none;scroll-snap-type:x proximity}
.dstrip::-webkit-scrollbar{display:none}
.dtile{position:relative;flex:none;width:62px;padding:8px 0 9px;border-radius:18px;border:1px solid #E3D6C6;background:#fff;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;scroll-snap-align:center;font-family:inherit}
.dtile .dw{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#6B5E50;font-weight:600}
.dtile .dn{font-family:'Space Grotesk';font-size:24px;font-weight:700;line-height:28px;color:#1F1B16}
.dtile .dc{font-size:11px;color:#6B5E50;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtile.on{background:var(--c);border-color:var(--c);box-shadow:0 6px 14px -6px var(--c)}
.dtile.on .dw,.dtile.on .dc,.dtile.on .dn{color:#fff}
.dbadge{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#1F1B16;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.wxfx{position:absolute;inset:0;pointer-events:none;opacity:.55}
.wxfx.rain{background-image:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.55) 9px 10px);background-size:40px 60px;animation:wxr .6s linear infinite}
@keyframes wxr{to{background-position:-12px 60px}}
.wxfx.snow{background-image:radial-gradient(circle,#fff 2px,transparent 3px),radial-gradient(circle,#fff 1.5px,transparent 2.5px);background-size:46px 50px,31px 37px;animation:wxs 4s linear infinite}
@keyframes wxs{to{background-position:10px 100px,-8px 74px}}
.wxfx.cloud{background:radial-gradient(60px 28px at 20% 25%,rgba(255,255,255,.5),transparent 70%),radial-gradient(80px 32px at 75% 60%,rgba(255,255,255,.4),transparent 70%);background-size:200% 100%;animation:wxc 18s linear infinite alternate}
@keyframes wxc{to{background-position:60% 0}}
.wxfx.sun{background:radial-gradient(circle at 92% 8%,rgba(255,236,150,.85),rgba(255,236,150,0) 45%)}
.wxfx.fog{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.1) 60%,rgba(255,255,255,.3));animation:wxc 10s ease-in-out infinite alternate}
.dhero>*:not(.wxfx){position:relative}
.wxbox{position:relative;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 14px;backdrop-filter:blur(2px)}
.dhero{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));display:flex;flex-direction:column;gap:6px}
.tline{display:flex;flex-direction:column;position:relative}
.trow{display:grid;grid-template-columns:44px 12px 1fr;gap:8px;align-items:stretch;position:relative}
.trow .th{font-family:'Space Grotesk';font-weight:700;font-size:15px;padding-top:14px;text-align:right}
.trow .tdot{position:relative}
.trow .tdot::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:#E3D6C6}
.trow .tdot::after{content:"";position:absolute;left:1px;top:18px;width:12px;height:12px;border-radius:6px;background:var(--ams);border:2px solid #fff;box-shadow:0 0 0 1px #E3D6C6}
.trow:first-child .tdot::before{top:24px}.trow:last-child .tdot::before{bottom:calc(100% - 24px)}
.tcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;margin:5px 0;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-family:inherit;cursor:pointer;width:100%}
p,.tcard .td,.small.muted,.dhero .small,.card-p .small{text-align:justify;hyphens:none;-webkit-hyphens:none;overflow-wrap:normal;word-break:normal}
.row.small,.row .small,.chip,.tile .small,.dtile *,.empty .small{text-align:left}
.tcard .tprice{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:#FFE3C2;color:#7A3500;font-weight:800;font-size:14px;line-height:18px;padding:6px 12px;border-radius:999px;margin-top:4px}
.tcard .td{display:block;font-size:14px;font-weight:400;color:#5E5347;line-height:20px;white-space:pre-line;overflow-wrap:break-word;margin-top:2px}
.tcard .tt{font-size:15px;font-weight:600;color:#1F1B16;white-space:pre-line;overflow-wrap:anywhere}
.grip{touch-action:none;display:flex;align-items:center;justify-content:center;color:#A39484;font-size:20px;letter-spacing:-3px;cursor:grab;user-select:none;-webkit-user-select:none;writing-mode:vertical-rl}
.tcard{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.trow.dragging{transform:scale(1.02);opacity:.95;filter:drop-shadow(0 8px 14px rgba(0,0,0,.2));position:relative}
.trow.dropbefore .tcard{box-shadow:0 -4px 0 -1px var(--ams)}
.trow.dropend .tcard{box-shadow:0 4px 0 -1px var(--ams)}
.tdoc{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--fly-soft);color:var(--fly-ink);font-size:13px;font-weight:700;margin-top:4px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:none;border:0;text-align:left;padding:0;width:100%}
.box{margin-top:2px;width:22px;height:22px;border-radius:7px;border:2px solid #B8741A;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.box.on{background:#B8741A}
.daycard{border-left:6px solid var(--c);background:#fff;border-radius:0 18px 18px 0;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.daycard.today{box-shadow:0 0 0 3px rgba(242,106,33,.35)}
.sheetbg{position:fixed;inset:0;background:rgba(31,27,22,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.in{height:48px;border-radius:12px;border:1.5px solid #D8C9B6;background:#fff;padding:0 12px;width:100%}
textarea.in{height:auto;min-height:80px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;z-index:60;max-width:90%;text-align:center}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:var(--soft)}
.status i{width:8px;height:8px;border-radius:4px;background:#999;display:block}
.status.ok i{background:#2E9E5B}
.status.off i{background:#C97A00}
.listrow{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:18px;width:100%;text-align:left;cursor:pointer;min-height:64px}
.gate{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px}
.empty{background:var(--soft);border-radius:18px;padding:22px 18px;text-align:center;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid #E3D6C6;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--ink)}
.iconbtn.on{background:var(--ams);border-color:var(--ams)}
.iconbtn.ok{background:var(--bru);border-color:var(--bru);color:#fff}
</style>
</head>
<body>
<div id="app"><div id="view"></div></div>
<div id="tabs"></div>
<div id="sheet"></div>
<div id="toast"></div>

async function seedLugares(){
  try{
    const f = await F.getDoc(docRef('config','seed_lugares1'));
    if(f.exists()) return;
    const b = F.writeBatch(db);
    SEED_LUGARES.forEach((l,i)=>{ const {id,...d}=l; b.set(docRef('lugares',id),{...d,creado:1700000000000+i}); });
    b.set(docRef('config','seed_lugares1'),{v:true});
    await b.commit();
  }catch(e){ console.error('seedLugares',e); }
}
async function seedGastos(){
  try{
    const s = await F.getDoc(docRef('config','seed'));
    if(!s.exists()){
      const b = F.writeBatch(db);
      DATA.gastos.lineas.forEach((l,i)=>b.set(docRef('gastos','g'+(i+1)),{fecha:l[0],concepto:l[1],total:Math.round(l[2]*100),pagador:'Cristina',orden:i}));
      b.set(docRef('config','seed'),{v:true}); b.set(docRef('config','pagador1'),{v:true});
      await b.commit(); return;
    }
    // Una sola vez: los gastos iniciales sin pagador los pagó Cristina.
    const m = await F.getDoc(docRef('config','pagador1'));
    if(m.exists()) return;
    for(let i=1;i<=DATA.gastos.lineas.length;i++){
      const d = await F.getDoc(docRef('gastos','g'+i));
      if(d.exists() && !normP(d.data().pagador)) await F.setDoc(docRef('gastos','g'+i),{...d.data(),pagador:'Cristina'});
    }
    await F.setDoc(docRef('config','pagador1'),{v:true});
  }catch(e){ console.error('seed',e); }
}

  return backBar('Documentos') + `<div class="pad stack-l"><div class="muted small">Sube fotos o PDF pequeños (hasta ≈ 650 KB) de billetes, entradas y reservas, o pega un enlace. Los ven los dos móviles.</div>
  <button class="btn fly" data-act="adddoc">${ic('plus')} Añadir documento</button>
  ${S.archivos.length?CATS.filter(c=>by(c).length).map(c=>`<div class="stack" style="gap:8px"><h2 class="h2">${c}</h2>${c==='Transportes'?TSUBS.filter(t=>by(c).some(a=>subOf(a)===t)).map(t=>`<div class="small muted" style="font-weight:700;text-align:left;margin-top:2px">${t==='Vuelo'?'Vuelos':t==='Tren'?'Trenes':t==='Bus'?'Bus':'Otros'}</div>${by(c).filter(a=>subOf(a)===t).map(docRow).join('')}`).join(''):by(c).map(docRow).join('')}</div>`).join(''):`<div class="empty">Aún no hay documentos.<br>Empieza con los billetes de avión.</div>`}</div>`;
}
function totalGastos(){ return S.gastos.reduce((s,g)=>s+(g.total||0),0); }
function cuentas(){
  const paid={Alejandro:0,Cristina:0}, cnt={Alejandro:0,Cristina:0}, owe={Alejandro:0,Cristina:0}; let sin=0, sinN=0;
  S.gastos.forEach(g=>{ const p=g.pagador;
    if(p==='Alejandro'||p==='Cristina'){ paid[p]+=g.total; cnt[p]++; owe[p==='Alejandro'?'Cristina':'Alejandro']+=half(g.total); }
    else { sin+=g.total; sinN++; } });
  let net=owe.Alejandro-owe.Cristina, dev=0; (S.pagos||[]).forEach(p=>{ const i=+p.importe||0; dev+=i; if(p.de==='Alejandro') net-=i; else if(p.de==='Cristina') net+=i; });
  return {paid,cnt,sin,sinN,net,dev};   // net>0: Alejandro debe a Cristina
}
function gastoRow(g){ return `<button class="listrow" data-act="editgasto" data-id="${g.id}"><span class="stack" style="gap:0;flex:1;min-width:0"><span style="font-weight:700">${esc(g.concepto)}</span><span class="small muted">${fmtFecha(g.fecha)}${g.pagador?' · pagó '+esc(g.pagador):' · sin pagador'}</span></span><span class="stack" style="gap:0;text-align:right"><span style="font-weight:700">${eur(g.total)}</span><span class="small muted">${eur(half(g.total))} c/u</span></span></button>`; }
function viewGastos(){
  const sortf=(a,b)=>(a.fecha||'').slice(0,10).localeCompare((b.fecha||'').slice(0,10)) || (a.orden??99)-(b.orden??99);
  const list=[...S.gastos].sort(sortf);
  const tot=totalGastos(); const q=cuentas();
  const bal = (q.cnt.Alejandro+q.cnt.Cristina)===0 ? 'Indica quién pagó cada gasto para ver el saldo'
    : (q.net>0?`Alejandro debe <b>${eur(q.net)}</b> a Cristina`:(q.net<0?`Cristina debe <b>${eur(-q.net)}</b> a Alejandro`:'Estáis en paz'));
  const tab=S.gTab;
  const devs=[...(S.pagos||[])].sort((a,b)=>(b.creado||0)-(a.creado||0));
  const devList=devs.length?`<div class="stack" style="gap:8px"><h2 class="h2">Devoluciones</h2>${devs.map(p=>`<button class="listrow" data-act="editdev" data-id="${p.id}"><span class="stack" style="gap:0;flex:1;min-width:0"><span style="font-weight:700">${esc(p.de)} → ${esc(p.a)}</span><span class="small muted">${fmtFecha(p.fecha)}${p.nota?' · '+esc(p.nota):''}</span></span><span style="font-weight:700">${eur(p.importe)}</span></button>`).join('')}</div>`:'';
  let body='';
  if(tab==='lista'){
    body=`<div class="stack" style="gap:8px">${list.map(gastoRow).join('')}</div>`;
  } else {
    const person=(n,col,soft,ink)=>`<div style="flex:1;background:${soft};border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;color:${ink}"><div class="small" style="font-weight:700">${n} ha pagado</div><div style="font-family:'Space Grotesk';font-size:24px;line-height:30px;font-weight:700">${eur(q.paid[n])}</div><div class="small">${q.cnt[n]} ${q.cnt[n]===1?'gasto':'gastos'}</div></div>`;
    const lst=n=>{ const l=list.filter(g=>g.pagador===n); return l.length?`<div class="stack" style="gap:8px"><div class="row" style="justify-content:space-between"><h2 class="h2">Pagos de ${n}</h2><span style="font-weight:700">${eur(q.paid[n])}</span></div>${l.map(gastoRow).join('')}</div>`:''; };
    const owes = q.net>0?['Alejandro','Cristina',q.net]:(q.net<0?['Cristina','Alejandro',-q.net]:null);
    body=`<div class="stack-l">
      <div class="row" style="gap:10px;align-items:stretch">${person('Alejandro','','var(--ams-soft)','var(--ams-ink)')}${person('Cristina','','var(--bxl-soft)','var(--bxl-ink)')}</div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px">
        <div class="small muted" style="font-weight:600">Cuentas</div>
        ${owes?`<div style="font-family:'Space Grotesk';font-size:24px;line-height:30px;font-weight:700">${owes[0]} debe ${eur(owes[2])} a ${owes[1]}</div>`:`<div style="font-family:'Space Grotesk';font-size:24px;line-height:30px;font-weight:700">${(q.cnt.Alejandro+q.cnt.Cristina)?'Estáis en paz':'Sin pagos asignados'}</div>`}
        <div class="small muted">Cada gasto se reparte a partes iguales. A cada uno le corresponde ${eur(half(tot))} del total de ${eur(tot)}.</div></div>
      ${q.sinN?`<div style="background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:16px;padding:12px;color:var(--warn-ink)" class="small"><b>${q.sinN} ${q.sinN===1?'gasto sin pagador':'gastos sin pagador'}</b> (${eur(q.sin)}) no cuentan en el saldo. Ábrelos y elige quién pagó.</div>`:''}
      ${lst('Cristina')}${lst('Alejandro')}</div>`;
  }
  return (S.sub==='gastos'?backBar('Gastos'):`<div style="padding:20px 20px 0"><h1 style="font-size:30px">Gastos</h1></div>`) + `<div class="pad stack-l">
   <div style="background:var(--bru-soft);border:1px solid #BFE0CC;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px;color:var(--bru-ink)">
     <div class="row" style="justify-content:space-between"><span class="small" style="font-weight:600">Total del viaje</span><span class="status ${S.online?'ok':'off'}"><i></i>${S.online?'Sincronizado':'Sin conexión'}</span></div>
     <div style="font-family:'Space Grotesk';font-size:34px;line-height:40px;font-weight:700">${eur(tot)}</div>
     <div style="font-size:16px;font-weight:600">${eur(half(tot))} por persona</div>
     <div class="small" style="margin-top:4px">${bal}${q.dev?` · ya devuelto ${eur(q.dev)}`:''}</div></div>
   <div class="row" style="gap:8px"><button class="btn ams" data-act="addgasto" style="flex:1">${ic('plus')} Añadir gasto</button><button class="btn ghost" data-act="adddev" style="flex:1">${ic('wallet')} Devolver dinero</button></div>
   <div class="seg"><button class="${tab==='lista'?'on':''}" data-act="gtab" data-v="lista">Gastos</button><button class="${tab==='cuentas'?'on':''}" data-act="gtab" data-v="cuentas">Quién pagó</button></div>
   ${body}${devList}</div>`;
}

/* ====================== render ====================== */
function currentName(){ return S.sub || S.tab; }
function render(only){
  if(!S.code){ renderGate(); return; }
  if(only && !only.includes(currentName())) { renderTabs(); return; }
  const v={inicio:viewInicio,ruta:()=>(S.sub==='ruta'?backRow():'')+viewRuta(),comer:viewComer,planes:viewPlanes,mas:viewMas,hoteles:viewHoteles,docs:viewDocs,fotos:viewFotos,tiktoks:viewTiktoks,tiempo:viewTiempo,gastos:viewGastos}[currentName()];
  const y=window.scrollY; $('#view').innerHTML=v(); if(currentName()==='comer') applyCq(); if(currentName()==='planes'){ const o=document.querySelector('.dtile.on'); if(o&&o.parentNode) o.parentNode.scrollLeft=o.offsetLeft-o.parentNode.clientWidth/2+o.offsetWidth/2; } renderTabs(); if(only) window.scrollTo(0,y);
}
function renderTabs(){
  if(!S.code){ $('#tabs').innerHTML=''; return; }
  const items=[['inicio','home','Inicio'],['gastos','wallet','Gastos'],['planes','plans','Planes'],['comer','eat','Comer'],['mas','more','Más']];
  const cur=S.sub?'mas':S.tab;
  $('#tabs').innerHTML=`<nav class="tabbar" aria-label="Secciones">${items.map(([k,i,l])=>`<button class="${cur===k?'on':''}" data-act="tab" data-tab="${k}" ${cur===k?'aria-current="page"':''}><span class="ic">${ic(i)}</span>${l}</button>`).join('')}</nav>`;
}
function renderGate(){
  $('#tabs').innerHTML='';
  $('#view').innerHTML=`<div class="gate"><div class="stack" style="gap:6px"><div class="small muted" style="font-weight:600">Viaje noviembre 2026</div><h1 style="font-size:32px;line-height:38px">Ámsterdam, Brujas, Gante y Bruselas</h1></div>
   <label class="f">Código del viaje<input class="in" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="El que os habéis pasado"></label>
   <div class="stack" style="gap:6px"><div style="font-weight:600;font-size:14px">¿Quién eres?</div><div class="seg" id="yoseg"><button class="on" data-yo="Alejandro">Alejandro</button><button data-yo="Cristina">Cristina</button></div></div>
   <button class="btn ams" id="entrar">Entrar</button><div class="small muted">El código lo guarda este móvil; solo hay que escribirlo una vez.</div></div>`;
  let yo=S.yo; $('#yoseg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; yo=b.dataset.yo; [...$('#yoseg').children].forEach(x=>x.classList.toggle('on',x===b)); };
  [...$('#yoseg').children].forEach(x=>x.classList.toggle('on',x.dataset.yo===yo));
  $('#entrar').onclick=()=>{ const c=$('#code').value.trim(); if(c.length<8){ toast('El código debe tener al menos 8 caracteres.'); return; } S.code=c; S.yo=yo; store.set('viaje.code',c); store.set('viaje.yo',yo); render(); initFB(); };
}

/* ====================== hojas (formularios) ====================== */
function openSheet(html){ $('#sheet').innerHTML=`<div class="sheetbg" data-act="closesheet"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet(){ $('#sheet').innerHTML=''; }
const sheetHead=t=>`<div class="row" style="justify-content:space-between"><h2 style="font-size:22px">${t}</h2><button class="iconbtn" data-act="closesheet" aria-label="Cerrar">${ic('x')}</button></div>`;


function sheetDev(p){
  const q=cuentas(); const nuevo=!p;
  const deb=q.net>0?'Alejandro':(q.net<0?'Cristina':(S.yo||'Alejandro')); const cred=deb==='Alejandro'?'Cristina':'Alejandro';
  p=p||{de:deb,a:cred,importe:Math.abs(q.net),fecha:todayStr(),nota:'Bizum'};
  let de=p.de;
  openSheet(`${sheetHead(nuevo?'Devolver dinero':'Editar devolución')}
   <div class="small muted">Registra el Bizum (o efectivo) que uno le da al otro: se descuenta de lo que se debe.</div>
   <div class="f">Quién paga<div class="seg" id="dv-seg"><button data-v="Alejandro" class="${de==='Alejandro'?'on':''}">Alejandro</button><button data-v="Cristina" class="${de==='Cristina'?'on':''}">Cristina</button></div></div>
   <div class="small" id="dv-a"></div>
   <label class="f">Importe (€)<input class="in" id="dv-i" inputmode="decimal" value="${p.importe?(p.importe/100).toFixed(2).replace('.',','):''}" placeholder="0,00"></label>
   <label class="f">Fecha<input class="in" id="dv-f" type="date" value="${esc((p.fecha||'').slice(0,10))}"></label>
   <label class="f">Nota (opcional)<input class="in" id="dv-n" value="${esc(p.nota||'')}" placeholder="Bizum"></label>
   <button class="btn ams" id="dv-ok">Guardar</button>${nuevo?'':`<button class="btn danger" id="dv-del">${ic('trash',18)} Borrar devolución</button>`}`);
  const upA=()=>{ $('#dv-a').textContent='Se lo da a '+(de==='Alejandro'?'Cristina':'Alejandro')+'.'; }; upA();
  $('#dv-seg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; de=b.dataset.v; [...$('#dv-seg').children].forEach(x=>x.classList.toggle('on',x===b)); upA(); };
  $('#dv-ok').onclick=async()=>{ const importe=parseImporte($('#dv-i').value); if(!importe){ toast('Pon el importe.'); return; }
    const data={de,a:de==='Alejandro'?'Cristina':'Alejandro',importe,fecha:$('#dv-f').value||todayStr(),nota:$('#dv-n').value.trim(),creado:p.creado||Date.now()};
    const ok=await dbDo(()=> nuevo?F.addDoc(colRef('pagos'),data):F.setDoc(docRef('pagos',p.id),data)); if(ok) closeSheet(); };
  if(!nuevo) $('#dv-del').onclick=async()=>{ if(!confirm('¿Borrar esta devolución?')) return; const ok=await dbDo(()=>F.deleteDoc(docRef('pagos',p.id))); if(ok) closeSheet(); };
}
function sheetGasto(g){
  const nuevo=!g; g=g||{fecha:(todayStr()>=TRIP_START&&todayStr()<=TRIP_END)?todayStr():TRIP_START, concepto:'', total:0, pagador:''};
  let pag=g.pagador||'';
  const fechaVal=(g.fecha||'').slice(0,10);
  openSheet(`${sheetHead(nuevo?'Añadir gasto':'Editar gasto')}
   <label class="f">Concepto<input class="in" id="g-c" value="${esc(g.concepto)}" placeholder="Cena, tren, entradas…"></label>
   <label class="f">Importe total (€)<input class="in" id="g-t" inputmode="decimal" value="${g.total?(g.total/100).toFixed(2).replace('.',','):''}" placeholder="0,00"></label>
   <label class="f">Fecha<input class="in" id="g-f" type="date" value="${fechaVal}"></label>
   <div class="stack" style="gap:6px"><div style="font-weight:600;font-size:14px">¿Quién ha pagado? *</div><div class="seg" id="g-seg"><button data-p="Alejandro" class="${pag==='Alejandro'?'on':''}">Alejandro</button><button data-p="Cristina" class="${pag==='Cristina'?'on':''}">Cristina</button></div></div>
   <div class="small muted" id="g-h"></div>
   <button class="btn ams" id="g-ok">Guardar</button>${nuevo?'':`<button class="btn danger" id="g-del">${ic('trash',18)} Borrar gasto</button>`}`);
  const upd=()=>{ const v=parseImporte($('#g-t').value); const other=pag==='Alejandro'?'Cristina':'Alejandro';
    $('#g-h').textContent = v ? (pag ? `${pag} paga ${eur(v)} y ${other} le debe ${eur(half(v))}.` : `${eur(half(v))} por persona. Elige quién pagó.`) : 'Se reparte a partes iguales.'; };
  $('#g-t').oninput=upd;
  $('#g-seg').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; pag=b.dataset.p; [...$('#g-seg').children].forEach(x=>x.classList.toggle('on',x===b)); upd(); };
  upd();
  $('#g-ok').onclick=async()=>{
    const c=$('#g-c').value.trim(), t=parseImporte($('#g-t').value), f=$('#g-f').value;
    if(!c){ toast('Pon un concepto.'); return; } if(!t){ toast('Pon un importe válido.'); return; } if(!pag){ toast('Elige quién ha pagado.'); return; }
    const data={concepto:c,total:t,fecha:f||TRIP_START,pagador:pag,orden:g.orden??50};
    const ok = await dbDo(()=> nuevo ? F.addDoc(colRef('gastos'),{...data,creado:Date.now(),orden:50}) : F.setDoc(docRef('gastos',g.id),data));
    if(ok) closeSheet();
  };
  if(!nuevo) $('#g-del').onclick=async()=>{ if(!confirm('¿Borrar este gasto?')) return; const ok=await dbDo(()=>F.deleteDoc(docRef('gastos',g.id))); if(ok) closeSheet(); };
}
function parseImporte(s){ const n=Number(String(s).trim().replace(/\s/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return (isFinite(n)&&n>0)?Math.round(n*100):0; }

function planParts(p){
  if(p.titulo!==undefined&&p.titulo!==null) return {t:p.titulo, d:p.desc||''};
  const x=String(p.texto||'').trim(); const m=x.match(/^([^\n]{4,70}?)(?::\s+|\.\s+|\n)([\s\S]+)$/);
  if(m){ const d=m[2].trim(); return {t:m[1].trim(), d:d.charAt(0).toUpperCase()+d.slice(1)}; }
  return x.length>70?{t:x.slice(0,67).replace(/\s+\S*$/,'')+'…', d:x}:{t:x, d:''};
}
function sheetPlan(dia0,p,pre){ pre=pre||{};
  const nuevo=!p; p=p||{hora:'',titulo:pre.texto||'',desc:'',web:'',ubicacion:pre.ubic||''};
  const pp=planParts(p); const webV=p.web!==undefined?p.web:(p.enlace||'');
  const def=p.dia||dia0||(pre.city&&(DAYS.find(z=>z.city===pre.city)||{}).d)||((todayStr()>=TRIP_START&&todayStr()<=TRIP_END)?todayStr():TRIP_START);
  openSheet(`${sheetHead(nuevo?'Añadir plan':'Editar plan')}
   <label class="f">Día<select class="in" id="p-dia">${DAYS.map(x=>{const dd=new Date(x.d+'T12:00:00'); return `<option value="${x.d}" ${x.d===def?'selected':''}>${DIAL[dd.getDay()]} ${dd.getDate()} ${MES[dd.getMonth()]} · ${x.city}</option>`}).join('')}</select></label>
   <label class="f">Hora (opcional)<input class="in" id="p-h" type="time" value="${esc(p.hora)}"></label>
   <label class="f">Precio (opcional)<input class="in" id="p-pr" inputmode="decimal" placeholder="Ej. 16,50 € o 10–15 €" value="${esc(p.precio||'')}"></label>
   <label class="f">Nombre del plan<input class="in" id="p-t" placeholder="Ej. Casa de Ana Frank" value="${esc(pp.t)}"></label>
   <label class="f">Descripción (opcional)<textarea class="in" id="p-x" rows="4" placeholder="Detalles, horarios, si hay que reservar…">${esc(pp.d)}</textarea></label>
   <a class="btn ghost sm" id="p-mp" target="_blank" rel="noopener">${ic('out',16)} Buscar sitio en Google Maps</a>
   <label class="f">Enlace de ubicación (opcional)<input class="in" id="p-u" type="url" inputmode="url" placeholder="Pega aquí el enlace de Google Maps" value="${esc(p.ubicacion||'')}"></label>
   <label class="f">Enlace web (opcional)<input class="in" id="p-l" type="url" inputmode="url" placeholder="https://…" value="${esc(webV)}"></label>
   <label class="f">Documento ligado (opcional)<select class="in" id="p-a"><option value="">Ninguno</option>${S.archivos.map(a=>`<option value="${a.id}" ${a.id===p.archivoId?'selected':''}>${esc(a.titulo)}</option>`).join('')}</select></label>
   <button class="btn ams" id="p-ok">Guardar</button>${nuevo?'':`<button class="btn danger" id="p-del">${ic('trash',18)} Borrar plan</button>`}`);
  const pcity=()=>{ const c=(DAYS.find(z=>z.d===$('#p-dia').value)||{}).city; return c&&c!=='Vuelos'?c:''; };
  const setMp=()=>{ $('#p-mp').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(($('#p-t').value.trim()||'')+' '+pcity()); }; setMp();
  $('#p-t').addEventListener('input',setMp); $('#p-dia').addEventListener('change',setMp);
  $('#p-ok').onclick=async()=>{ const t=$('#p-t').value.trim(); if(!t){ toast('Pon el nombre del plan.'); return; }
    const desc=$('#p-x').value.trim(); const fix=v=>{ v=v.trim(); return v&&!/^https?:\/\//i.test(v)?'https://'+v:v; }; const ubicacion=fix($('#p-u').value);
    const dia=$('#p-dia').value; const web=fix($('#p-l').value);
    let precio=$('#p-pr').value.trim(); if(/^\d+([.,]\d+)?$/.test(precio)) precio+=' €';
    const data={dia,hora:$('#p-h').value,precio,titulo:t,desc,texto:t+(desc?'\n'+desc:''),ubicacion,web,enlace:web,lugar:p.lugar||'',archivoId:$('#p-a').value};
    const ok=await dbDo(()=> nuevo ? F.addDoc(colRef('planes'),{...data,creado:Date.now()}) : F.setDoc(docRef('planes',p.id),{...data,orden:(p.dia===dia&&p.orden!=null)?p.orden:null,creado:p.creado||Date.now()}));
    if(ok){ closeSheet(); S.pd=dia; if(S.pick){ S.pick=null; S.tab='planes'; S.sub=null; render(); window.scrollTo(0,0);} else render(); } };
  if(!nuevo) $('#p-del').onclick=async()=>{ const ok=await dbDo(()=>F.deleteDoc(docRef('planes',p.id))); if(ok) closeSheet(); };
}

   <button class="btn ams" id="c-plan">${ic('plans',20)} Un plan</button>
   <button class="btn ghost" id="c-rest">${ic('eat',20)} Elegir restaurante de la lista</button>
   <a class="btn ghost" id="c-maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/${encodeURIComponent('restaurantes '+(city==='Vuelos'?'':city))}">${ic('out',18)} Buscar uno nuevo en Google Maps</a>`);

function sheetLugar(l,pre){
  pre=pre||{}; const nuevo=!l;
  const CIT=['Ámsterdam','Brujas','Gante','Bruselas'];
  const cityOk = c=>CIT.includes(c)?c:S.city;
  l=l||{nombre:'',ciudad:cityOk(pre.ciudad||S.city),comida:pre.comida||S.meal,direccion:'',precio:'',horario:'',reserva:'',minutos:'',maps:'',desc:'',foto:'',dia:pre.dia||''};
  const opt=(arr,v)=>arr.map(a=>`<option ${a===v?'selected':''}>${a}</option>`).join('');
  openSheet(`${sheetHead(nuevo?'Añadir sitio':'Editar sitio')}

  const upd=()=>{ const el=$('#mp-st'); if(el) el.textContent=`${pts.length} de ${items.length} sitios en el mapa${done<items.length?' · buscando…':''}${miss?` · ${miss} sin localizar`:''}`; };
  const add=(it,ll,i)=>{ const g='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([it.n,it.a,it.c].filter(Boolean).join(', '));
    const d='https://www.google.com/maps/dir/?api=1&travelmode=walking&destination='+encodeURIComponent([it.n,it.a,it.c].filter(Boolean).join(', '));
    const m=L.marker(ll,{icon:L.divIcon({className:'',html:`<div style="background:${col};color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 13px Space Grotesk,sans-serif">${i+1}</div>`,iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);
    m.bindPopup(`<b>${esc(it.n)}</b><br><span style="font-size:12px">${esc(it.a)}</span><br><a href="${esc(g)}" target="_blank" rel="noopener">Abrir en Google Maps</a> · <a href="${esc(d)}" target="_blank" rel="noopener">Cómo llegar</a>`);
    pts.push(ll); map.fitBounds(L.latLngBounds(pts).pad(.15),{maxZoom:16}); };
  const BB={'Ámsterdam':[4.80,52.32,4.99,52.43],'Brujas':[3.12,51.17,3.32,51.25],'Gante':[3.62,50.99,3.84,51.12],'Bruselas':[4.25,50.77,4.50,50.93]}[city]||[2,50,7,53];
  const nom=async q=>{ const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=3&bounded=1&viewbox=${BB[0]},${BB[3]},${BB[2]},${BB[1]}&q=`+encodeURIComponent(q)).then(x=>x.json()); const x=r.find(z=>+z.lon>=BB[0]&&+z.lon<=BB[2]&&+z.lat>=BB[1]&&+z.lat<=BB[3]); return x?[+x.lat,+x.lon]:null; };
  let saved=false;
  for(let i=0;i<items.length;i++){
    if(!$('#mapov')) return; const it=items[i]; const key=hashQ('v3|'+[it.n,it.a,it.c].join('|')); let ll=geo[key];
    if(!ll){ try{ ll=it.a?await nom(it.a+', '+it.c):null; await new Promise(r=>setTimeout(r,1100)); if(!ll&&it.a&&/Dweerstraat/.test(it.a)){ ll=await nom(it.a.replace('Dweerstraat','Dweersstraat')+', '+it.c); await new Promise(r=>setTimeout(r,1100)); } if(!ll){ ll=await nom(it.n+', '+it.c); await new Promise(r=>setTimeout(r,1100)); } }catch(e){ ll=null; }
      if(ll){ geo[key]=ll; saved=true; try{ localStorage.setItem('viaje.geo',JSON.stringify(geo)); }catch(_){} if(S.dbReady) F.setDoc(docRef('config','geo'),{[key]:ll},{merge:true}).catch(()=>{}); } }
    done++; if(ll) add(it,ll,i); else miss++; upd();
  }
  upd();
}

/* ====================== tiempo ====================== */
const WXC={Ámsterdam:[52.372,4.893],Brujas:[51.209,3.225],Gante:[51.054,3.722],Bruselas:[50.846,4.352]};
const WMO=c=>c===0?['☀️','Despejado']:c<=2?['🌤️','Poco nuboso']:c===3?['☁️','Nublado']:c<=48?['🌫️','Niebla']:c<=57?['🌦️','Llovizna']:c<=67?['🌧️','Lluvia']:c<=77?['🌨️','Nieve']:c<=82?['🌧️','Chubascos']:c<=86?['🌨️','Nevadas']:['⛈️','Tormenta'];
function wxCity(day){ const c=day.city; if(c!=='Vuelos') return c; return day.d===DAYS[0].d?'Ámsterdam':'Bruselas'; }
function wxFor(city,d){ const w=S.wx&&S.wx[city]; if(!w) return null; const i=w.time.indexOf(d); return i<0?null:{code:w.weather_code[i],max:w.temperature_2m_max[i],min:w.temperature_2m_min[i],pp:w.precipitation_probability_max[i],mm:w.precipitation_sum[i],wind:w.wind_speed_10m_max[i]}; }
async function loadWx(force){
  if(!force&&S.wx&&Date.now()-S.wxAt<30*60e3) return;
  if(!S.wx){ try{ const c=JSON.parse(localStorage.getItem('viaje.wx')||'null'); if(c){ S.wx=c.d; S.wxAt=c.t; } }catch(_){} if(!force&&S.wx&&Date.now()-S.wxAt<30*60e3){ render(['tiempo','planes']); return; } }
  const names=Object.keys(WXC);
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+names.map(n=>WXC[n][0]).join(',')+'&longitude='+names.map(n=>WXC[n][1]).join(',')+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&timezone=Europe%2FBrussels&forecast_days=16').then(x=>{ if(!x.ok) throw 0; return x.json(); });
    const d={}; names.forEach((n,i)=>d[n]=r[i].daily); S.wx=d; S.wxAt=Date.now(); try{ localStorage.setItem('viaje.wx',JSON.stringify({d,t:S.wxAt})); }catch(_){}
    S.wxErr=false;
  }catch(e){ S.wxErr=true; }
  render(['tiempo','planes']);
}
function wxFx(code){ return code==null?'':code===0?'sun':code<=2?'sun cloud':code===3?'cloud':code<=48?'fog':code<=67?'rain':code<=77?'snow':code<=82?'rain':code<=86?'snow':'rain'; }
function wxHero(day){ const w=wxFor(wxCity(day),day.d); if(!w) return {fx:'',html:''}; const [e,t]=WMO(w.code);
  return {fx:wxFx(w.code), html:`<div class="wxbox"><div style="font-size:54px;line-height:56px">${e}</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:17px">${esc(t)}</div><div class="small" style="opacity:.95">💧 ${w.pp==null?'–':w.pp+'%'}${w.mm?' · '+w.mm+' mm':''} · 💨 ${Math.round(w.wind)} km/h</div></div><div style="text-align:right;font-family:'Space Grotesk';line-height:1"><div style="font-size:34px;font-weight:700">${Math.round(w.max)}°</div><div style="font-size:16px;opacity:.85">${Math.round(w.min)}°</div></div></div>`}; }
function wxLine(day){ const w=wxFor(wxCity(day),day.d); if(!w) return ''; const [e,t]=WMO(w.code); return `<div class="row small" style="gap:6px;font-weight:600">${e} ${esc(t)} · ${Math.round(w.min)}°/${Math.round(w.max)}° · 💧 ${w.pp==null?'–':w.pp+'%'}${w.wind!=null?' · 💨 '+Math.round(w.wind)+' km/h':''}</div>`; }
function viewTiempo(){
  const groups=[['Ámsterdam','var(--ams)','var(--ams-soft)',['2026-11-13','2026-11-14','2026-11-15','2026-11-16','2026-11-17']],['Brujas','var(--bru)','var(--bru-soft)',['2026-11-17','2026-11-18','2026-11-19']],['Gante','var(--bru)','var(--bru-soft)',['2026-11-18']],['Bruselas','var(--bxl)','var(--bxl-soft)',['2026-11-19','2026-11-20','2026-11-21']]];
  const hora=S.wxAt?new Date(S.wxAt).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  return backBar('Tiempo')+`<div class="pad stack-l">
   <div class="row" style="justify-content:space-between;gap:10px"><div class="small muted">${S.wx?`Actualizado ${esc(hora)}. Datos de Open-Meteo, que usa modelos de los servicios meteorológicos nacionales (no es una web oficial). Se renueva solo cada 30 min.`:(S.wxErr?'No se pudo cargar. ¿Hay conexión?':'Cargando previsión…')}</div><button class="btn ghost sm" data-act="wxrefresh">Actualizar</button></div>
   ${groups.map(([c,col,soft,ds])=>`<div class="stack" style="gap:8px"><h2 class="h2" style="color:${col}">${c}</h2><div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">${ds.map(d=>{ const w=wxFor(c,d); const dd=new Date(d+'T12:00:00'); const [e,t]=w?WMO(w.code):['',''];
     return `<div style="flex:none;width:112px;background:${soft};border-radius:18px;padding:12px 10px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center"><div class="small" style="font-weight:700;text-transform:uppercase">${DIA[dd.getDay()]} ${dd.getDate()}</div><div style="font-size:30px;line-height:36px">${e||'–'}</div><div class="small">${esc(t)}</div>${w?`<div style="font-family:'Space Grotesk';font-weight:700;font-size:18px">${Math.round(w.max)}° <span class="muted" style="font-weight:500">${Math.round(w.min)}°</span></div><div class="small">💧 ${w.pp==null?'–':w.pp+'%'}${w.mm?' · '+w.mm+' mm':''}</div><div class="small">💨 ${Math.round(w.wind)} km/h</div>`:'<div class="small muted">Sin datos aún</div>'}</div>`; }).join('')}</div></div>`).join('')}</div>`;
}
function sheetDoc(){
  openSheet(`${sheetHead('Añadir documento')}
   <label class="f">Título<input class="in" id="d-t" placeholder="Vuelo ida Sevilla → Ámsterdam"></label>
   <label class="f">Categoría<select class="in" id="d-c">${CATS.map(c=>`<option value="${c}">${c==="Transportes"?"Transportes (vuelo, tren, bus…)":c}</option>`).join('')}</select></label>
   <label class="f" id="d-sw">Tipo de transporte<select class="in" id="d-s">${TSUBS.map(t=>`<option>${t}</option>`).join('')}</select></label>
   <label class="f">Archivo (foto o PDF, hasta ≈ 650 KB)<input class="in" id="d-f" type="file" accept="image/*,application/pdf" style="padding:10px 12px;height:auto"></label>
   <label class="f">…o un enlace (si el archivo pesa mucho)<input class="in" id="d-l" inputmode="url" placeholder="https://"></label>
   <div class="small muted" id="d-m"></div>
   <button class="btn fly" id="d-ok">Guardar</button>`);
  const syncSub=()=>{ $('#d-sw').style.display=$('#d-c').value==='Transportes'?'':'none'; }; $('#d-c').onchange=syncSub; syncSub();
  $('#d-t').oninput=()=>{ const v=$('#d-t').value.toLowerCase(); if($('#d-c').value!=='Transportes') return; $('#d-s').value=/vuelo|avi[oó]n|flight/.test(v)?'Vuelo':/tren|renfe|sncb|ns |train/.test(v)?'Tren':/bus|autob/.test(v)?'Bus':$('#d-s').value; };
  $('#d-ok').onclick=async()=>{
    const titulo=$('#d-t').value.trim(), cat=$('#d-c').value, file=$('#d-f').files[0], link=$('#d-l').value.trim();
    if(!titulo){ toast('Pon un título.'); return; } if(!file&&!link){ toast('Elige un archivo o pega un enlace.'); return; }
    if(link && !/^https?:\/\//i.test(link)){ toast('El enlace debe empezar por http o https.'); return; }
    const btn=$('#d-ok'); btn.disabled=true; $('#d-m').textContent='Guardando…';
    try{
      const meta={titulo,cat,creado:Date.now()}; if(cat==='Transportes') meta.sub=$('#d-s').value; let data=null;
      if(file){
        let blob=file;
        if(file.type.startsWith('image/')) blob=await shrinkImage(file);
        else if(file.type!=='application/pdf'){ throw new Error('Solo fotos o PDF.'); }
        if(blob.size>MAXB) throw new Error('El archivo pesa demasiado ('+Math.round(blob.size/1024)+' KB). Usa un enlace o una foto más pequeña.');
        data=await toDataURL(blob); meta.nombre=file.name; meta.tipo=blob.type;
      } else meta.link=link;
      const ok=await dbDo(async()=>{ const ref=await F.addDoc(colRef('archivos'),meta); if(data) await F.setDoc(docRef('blobs',ref.id),{data}); });
      if(ok) closeSheet(); else { btn.disabled=false; $('#d-m').textContent=''; }
    }catch(e){ btn.disabled=false; $('#d-m').textContent=''; toast(e.message||'No se pudo guardar.'); }
  };
}
function toDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function shrinkImage(file, maxBytes=MAXB, maxDim=1800){
  const bmp = await createImageBitmap(file);
  let max=maxDim, q=.82, blob;
  for(let i=0;i<6;i++){
    const k=Math.min(1,max/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q)); if(blob.size<=maxBytes) return blob; max*=.8; q-=.06;
  }
  return blob;
}
async function sheetOpenDoc(id){
  const a=S.archivos.find(x=>x.id===id); if(!a) return;
  openSheet(`${sheetHead(esc(a.titulo))}<div class="small muted">${esc(catOf(a))}${catOf(a)==='Transportes'?' · '+subOf(a):''}${a.link?'':' · '+esc(a.nombre||'')}</div>${S.planes.filter(p=>p.archivoId===id).map(p=>`<div class="small" style="font-weight:600">Plan: ${esc(fmtFecha(p.dia))}${p.hora?' · '+esc(p.hora):''} · ${esc(p.texto)}</div>`).join('')}<div id="d-body" class="stack"><div class="empty">Cargando…</div></div>
   <div class="row" style="gap:8px"><label class="f" style="flex:1">Categoría<select class="in" id="d-ec">${CATS.map(c=>`<option ${c===catOf(a)?'selected':''}>${c}</option>`).join('')}</select></label><label class="f" id="d-esw" style="flex:1;${catOf(a)==='Transportes'?'':'display:none'}">Tipo<select class="in" id="d-es">${TSUBS.map(t=>`<option ${t===subOf(a)?'selected':''}>${t}</option>`).join('')}</select></label></div>
   <button class="btn danger" id="d-del">${ic('trash',18)} Borrar documento</button>`);
  const saveCls=async()=>{ const cat=$('#d-ec').value; $('#d-esw').style.display=cat==='Transportes'?'':'none'; const data={cat,sub:cat==='Transportes'?$('#d-es').value:null}; const ok=await dbDo(()=>F.setDoc(docRef('archivos',id),data,{merge:true})); if(ok) toast('Guardado ✓'); };
  $('#d-ec').onchange=saveCls; $('#d-es').onchange=saveCls;
  $('#d-del').onclick=async()=>{ if(!confirm('¿Borrar este documento?')) return; const ok=await dbDo(async()=>{ await F.deleteDoc(docRef('archivos',id)); if(!a.link) await F.deleteDoc(docRef('blobs',id)); }); if(ok) closeSheet(); };
  if(a.link){ $('#d-body').innerHTML=`<a class="btn fly" href="${esc(a.link)}" target="_blank" rel="noopener">Abrir enlace ${ic('out',18,2)}</a>`; return; }
  try{
    const s=await F.getDoc(docRef('blobs',id)); if(!s.exists()) throw new Error('nada');
    const data=s.data().data; const blob=await (await fetch(data)).blob(); const url=URL.createObjectURL(blob);
    $('#d-body').innerHTML = (a.tipo||'').startsWith('image/') ? `<img src="${url}" alt="" style="width:100%;border-radius:14px;border:1px solid var(--line)"><a class="btn fly" href="${url}" download="${esc(a.nombre||a.titulo)}">Descargar</a>`
      : `<a class="btn fly" href="${url}" target="_blank" rel="noopener">Abrir PDF ${ic('out',18,2)}</a><a class="btn ghost" href="${url}" download="${esc(a.nombre||a.titulo+'.pdf')}">Descargar</a>`;
  }catch(e){ $('#d-body').innerHTML='<div class="empty">No se pudo cargar el archivo. ¿Hay conexión?</div>'; }
}

/* ====================== eventos ====================== */
document.addEventListener('click', async e=>{
  if(window.__dragEnd&&Date.now()-window.__dragEnd<500){ window.__dragEnd=0; e.preventDefault(); return; }
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act;
  if(a==='closesheet'){ if(e.target===el||el.classList.contains('iconbtn')||el.closest('.iconbtn')) closeSheet(); return; }
  if(a==='tab'){ if(el.dataset.tab!=='comer') S.pick=null; S.tab=el.dataset.tab; S.sub=null; render(); window.scrollTo(0,0); if(S.tab==='planes') loadWx(); }
  else if(a==='go'){ if(el.dataset.tab==='ruta'){ S.tab='mas'; S.sub='ruta'; } else { S.tab=el.dataset.tab; S.sub=null; } render(); window.scrollTo(0,0); }
  else if(a==='sub'){ if(el.dataset.sub==='gastos'){ S.tab='gastos'; S.sub=null; } else { S.sub=el.dataset.sub; } render(); window.scrollTo(0,0); if(S.sub==='tiempo') loadWx(); }
  else if(a==='back'){ S.sub=null; S.tab='mas'; render(); window.scrollTo(0,0); }
  else if(a==='city'){ S.city=el.dataset.v; render(); }
  else if(a==='meal'){ S.meal=el.dataset.v; render(); }
  else if(a==='mark'){ const k=el.dataset.k; const nv=!S.marcas[k]; S.marcas[k]=nv; render(); await dbDo(()=>F.setDoc(docRef('marcas',k),{v:nv})); }
  else if(a==='addgasto') sheetGasto();
  else if(a==='gtab'){ S.gTab=el.dataset.v; render(); }
  else if(a==='addplantop') sheetPlan('');
  else if(a==='editgasto'){ const g=S.gastos.find(x=>x.id===el.dataset.id); if(g) sheetGasto(g); }
  else if(a==='pday'){ S.pd=el.dataset.d; render(); }
  else if(a==='addchoose') sheetChoose(el.dataset.d);
  else if(a==='plusrest') sheetPlan(S.pick||null,null,{texto:'Comer en '+el.dataset.n,city:el.dataset.c,ubic:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(el.dataset.n+' '+(el.dataset.c||''))});
  else if(a==='pickcancel'){ const d=S.pick; S.pick=null; S.pd=d; S.tab='planes'; render(); window.scrollTo(0,0); }
  else if(a==='openlink'){ window.open(el.dataset.u,'_blank','noopener'); }
  else if(a==='addlugar') sheetLugar(null,{});
  else if(a==='editlugar'){ const l=S.lugares.find(x=>x.id===el.dataset.id); if(l) sheetLugar(l); }
  else if(a==='editplan'){ const p=S.planes.find(x=>x.id===el.dataset.id); if(p) sheetPlan(p.dia,p); }
  else if(a==='edithotel') sheetHotel();
  else if(a==='adddoc') sheetDoc();
  else if(a==='adddev') sheetDev();
  else if(a==='editdev') sheetDev(S.pagos.find(x=>x.id===el.dataset.id));
  else if(a==='wxrefresh') loadWx(true);
  else if(a==='mapall') openMapAll();
  else if(a==='mapclose'){ const o=$('#mapov'); if(o) o.remove(); }
  else if(a==='addfoto') pickFotos(!!el.dataset.g);
  else if(a==='openfoto') sheetOpenFoto(el.dataset.id);
  else if(a==='addtt') sheetTt();
  else if(a==='opentt') sheetOpenTt(el.dataset.id);
  else if(a==='tcity'){ S.tcity=el.dataset.v; render(['tiktoks']); }
  else if(a==='ttipo'){ S.ttipo=el.dataset.v; render(['tiktoks']); }
  else if(a==='fcity'){ S.fcity=el.dataset.v; render(['fotos']); }
  else if(a==='fday'){ S.fday=el.dataset.v; render(['fotos']); }
  else if(a==='opendoc') sheetOpenDoc(el.dataset.id);
  else if(a==='chyo'){ S.yo=S.yo==='Alejandro'?'Cristina':'Alejandro'; store.set('viaje.yo',S.yo); render(); toast('Ahora eres '+S.yo+'.'); }
  else if(a==='chcode'){ if(confirm('¿Cambiar el código del viaje en este móvil?')){ store.del('viaje.code'); S.code=''; location.reload(); } }
});
window.addEventListener('online',()=>render()); window.addEventListener('offline',()=>{S.online=false;render();});

/* ====================== arranque ====================== */
(function(){ const p=new URLSearchParams(location.search); const c=p.get('c'); if(c&&c.length>=8){ S.code=c; store.set('viaje.code',c); history.replaceState(null,'',location.pathname); } })();
render();
initFB();
loadWx();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
